<style>
  @page { size: 9cm 5cm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lato', sans-serif;
    background: #e5e5e5;
  }
  .screen-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 24px;
    justify-content: center;
  }
  .card {
    width: 9cm;
    height: 5cm;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    page-break-after: always;
  }
  /* FRONT */
  .front {
    background: #fdf8f4;
    color: #3d2417;
    padding: 0.55cm 0.65cm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0.22cm;
    background: #b87060;
  }
  .front .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 22pt;
    color: #3d2417;
    line-height: 1.1;
  }
  .front .role {
    font-size: 7.5pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b87060;
    font-weight: 700;
    margin-top: 2px;
  }
  .front .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 10.5pt;
    color: #6b4535;
    margin-top: 6px;
  }
  .front .contact {
    font-size: 8pt;
    color: #3d2417;
    line-height: 1.65;
  }
  .front .contact .row {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .front .contact .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: #b87060;
    flex-shrink: 0;
  }
  /* BACK */
  .back {
    background: #fdf8f4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back img {
    width: 82%;
    height: auto;
  }
  .label {
    text-align: center;
    font-size: 11px;
    color: #666;
    margin-bottom: 6px;
    font-family: sans-serif;
  }
  @media print {
    body { background: none; }
    .screen-wrap { padding: 0; gap: 0; display: block; }
    .label { display: none; }
    .card { box-shadow: none; margin: 0; }
  }
</style>
